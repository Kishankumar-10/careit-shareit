name: careit_shareit
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  intl: ^0.20.2

  geolocator: ^13.0.2
  geocoding: ^3.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_native_splash:
  color: "#F8F4E8"
  image: assets/splash_logo.png

  android: true
  ios: true
fullscreen: true

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/app_icon.png"

  adaptive_icon_background: "#F8F4E8"
  adaptive_icon_foreground: "assets/app_icon.png"
